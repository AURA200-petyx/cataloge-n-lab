<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATALOGUE N-LAB — Каталог разработок и идей</title>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4EEDB;
            --card-bg: #FFFDF4;
            --text-color: #1A1A1A;
            --border-color: #1A1A1A;
            --accent-yellow: #FFD400;
            --shadow: 4px 5px 0px #1A1A1A;
            --shadow-hover: 6px 7px 0px #1A1A1A;
            --font-main: 'Patrick Hand', cursive, sans-serif;
            --font-title: 'Architects Daughter', cursive, sans-serif;
            --sketch-radius: 255px 25px 225px 25px / 25px 225px 25px 255px;
            --sketch-radius-sm: 255px 15px 225px 15px / 15px 225px 15px 255px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.04) 15%, transparent 16%),
                radial-gradient(rgba(139, 69, 19, 0.06) 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 19px;
            padding: 25px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* Шапка */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 45px;
            gap: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-height: 210px;
            width: auto;
            object-fit: contain;
            mix-blend-mode: multiply;
            transform: rotate(-1.5deg);
            transition: transform 0.2s ease;
        }

        .logo-img:hover {
            transform: rotate(0deg) scale(1.02);
        }

        /* Фильтры */
        .nav-filters {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            padding: 8px 18px;
            font-family: var(--font-main);
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
            border-radius: var(--sketch-radius);
            transform: rotate(1deg);
        }

        .filter-btn:nth-child(even) {
            transform: rotate(-1.5deg);
        }

        .filter-btn:hover {
            transform: translate(-2px, -2px) rotate(0deg);
            box-shadow: 5px 5px 0px var(--border-color);
        }

        .filter-btn.active {
            background-color: var(--accent-yellow);
        }

        /* Баннер-приветствие */
        .welcome-banner {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 40px;
            border-radius: 235px 25px 205px 35px / 35px 205px 25px 235px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            transform: rotate(-0.5deg);
        }

        .welcome-text h1 {
            font-family: var(--font-title);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .add-btn {
            background-color: #A3E4D7;
            border: 3px solid var(--border-color);
            padding: 10px 20px;
            font-family: var(--font-main);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            border-radius: var(--sketch-radius-sm);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
        }

        .add-btn:hover {
            background-color: #76D7C4;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-color);
        }

        /* Сетка проектов */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
            margin-bottom: 50px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            background-color: rgba(255, 253, 244, 0.7);
            border: 3px dashed #888;
            border-radius: var(--sketch-radius);
            padding: 45px 20px;
            color: #444;
            font-size: 22px;
        }

        .card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: var(--sketch-radius);
            box-shadow: var(--shadow);
            padding: 22px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform: rotate(0.8deg);
            position: relative;
        }

        .card:nth-child(even) {
            transform: rotate(-0.7deg);
        }

        .card:hover {
            transform: translateY(-5px) rotate(0deg);
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-tag {
            background-color: var(--accent-yellow);
            border: 2px solid var(--border-color);
            padding: 4px 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: var(--sketch-radius-sm);
        }

        .card-icon {
            font-size: 24px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--sketch-radius-sm);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            word-break: break-word;
        }

        .card-desc {
            font-size: 17px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px dashed #999;
            padding-top: 12px;
            font-size: 15px;
        }

        .card-date {
            color: #555;
        }

        .card-link-btn {
            font-weight: bold;
            color: #000;
        }

        .card:hover .card-link-btn {
            text-decoration: underline;
        }

        /* Кнопка удаления */
        .delete-card-btn {
            position: absolute;
            top: -12px;
            right: -10px;
            background: #FF6B6B;
            color: #1A1A1A;
            border: 2px solid var(--border-color);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .card:hover .delete-card-btn {
            display: flex;
        }

        .delete-card-btn:hover {
            background: #ff4c4c;
            transform: scale(1.1);
        }

        /* Футер */
        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: auto;
            font-family: var(--font-title);
            font-size: 14px;
            color: #555;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            box-shadow: 8px 8px 0px var(--border-color);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: var(--sketch-radius);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: none;
            line-height: 1;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .modal-grid {
                grid-template-columns: 1fr;
            }
        }

        .modal-preview-box {
            background: #EFE8D6;
            border: 2px dashed var(--border-color);
            padding: 20px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 200px;
            font-family: var(--font-title);
            font-weight: bold;
        }

        /* Форма */
        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 18px;
        }

        .sketch-input, .sketch-select, .sketch-textarea {
            width: 100%;
            background-color: #FFF;
            border: 3px solid var(--border-color);
            padding: 10px 14px;
            font-family: var(--font-main);
            font-size: 18px;
            color: var(--text-color);
            border-radius: var(--sketch-radius-sm);
            box-shadow: 2px 2px 0px var(--border-color);
            outline: none;
        }

        .sketch-input:focus, .sketch-select:focus, .sketch-textarea:focus {
            background-color: #FFFDF0;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .sketch-textarea {
            resize: vertical;
            min-height: 85px;
        }

        .submit-btn {
            background-color: var(--accent-yellow);
            border: 3px solid var(--border-color);
            padding: 12px 24px;
            font-family: var(--font-main);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            border-radius: var(--sketch-radius-sm);
            width: 100%;
            margin-top: 10px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .submit-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logo.png" alt="CATALOGUE N-LAB" class="logo-img" onerror="this.style.display='none'">
            </div>
            
            <nav class="nav-filters" id="filterBar">
                <button type="button" class="filter-btn active" data-category="all">ALL</button>
                <button type="button" class="filter-btn" data-category="games">GAMES</button>
                <button type="button" class="filter-btn" data-category="technologie">TECNOLOGE</button>
                <button type="button" class="filter-btn" data-category="lesson">LESSON</button>
                <button type="button" class="filter-btn" data-category="hobby">HOBBY / HEALTH</button>
            </nav>
        </header>

        <section class="welcome-banner">
            <div class="welcome-text">
                <h1>Лаборатория идей и разработок 🧪✨</h1>
                <p>Добро пожаловать в мой интерактивный каталог! Здесь собраны пет-проекты, алгоритмы, игры и учебные материалы.</p>
            </div>
            <button type="button" class="add-btn" id="openAddBtn">+ Добавить идею</button>
        </section>

        <main class="projects-grid" id="projectsGrid"></main>
    </div>

    <footer>
        CATALOGUE N-LAB © 2026 • Сделано с вдохновением и капелькой юмора
    </footer>

    <!-- Модальное окно просмотра проекта -->
    <div class="modal" id="projectModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button type="button" class="close-btn" data-close="projectModal" aria-label="Закрыть">&times;</button>
            <h2 id="modalTitle" style="font-family: var(--font-title); font-size: 26px; margin-bottom: 15px;"></h2>
            <div class="modal-grid">
                <div>
                    <p id="modalDesc" style="line-height: 1.6; margin-bottom: 20px; white-space: pre-line;"></p>
                    <p id="modalLinkWrapper">
                        <strong>Ссылка:</strong> 
                        <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer" style="color: #0066cc;">Открыть репозиторий / проект</a>
                    </p>
                </div>
                <div class="modal-preview-box">
                    <div id="modalPreviewIcon" style="font-size: 46px; margin-bottom: 10px;"></div>
                    <div id="modalPreviewTitle"></div>
                    <div style="font-size: 14px; color: #555; font-weight: normal; margin-top: 5px;">Схема и детали концепта</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления новой идеи -->
    <div class="modal" id="addIdeaModal" role="dialog" aria-modal="true">
        <div class="modal-content" style="max-width: 560px;">
            <button type="button" class="close-btn" data-close="addIdeaModal" aria-label="Закрыть">&times;</button>
            <h2 style="font-family: var(--font-title); font-size: 26px; margin-bottom: 20px;">Новая идея в каталог 💡</h2>
            
            <form id="addIdeaForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="ideaTitle">Название проекта *</label>
                        <input type="text" id="ideaTitle" class="sketch-input" placeholder="Например: Pixel RPG" required>
                    </div>
                    <div class="form-group">
                        <label for="ideaIcon">Иконка (Эмодзи)</label>
                        <input type="text" id="ideaIcon" class="sketch-input" value="🚀" maxlength="4">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ideaCategory">Категория *</label>
                        <select id="ideaCategory" class="sketch-select">
                            <option value="technologie">TECNOLOGE</option>
                            <option value="games">GAMES</option>
                            <option value="lesson">LESSON</option>
                            <option value="hobby">HOBBY / HEALTH</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ideaDate">Дата</label>
                        <input type="text" id="ideaDate" class="sketch-input" value="Ноя 2026">
                    </div>
                </div>

                <div class="form-group">
                    <label for="ideaShortDesc">Краткое описание (для карточки) *</label>
                    <input type="text" id="ideaShortDesc" class="sketch-input" placeholder="В двух словах о сути проекта..." required>
                </div>

                <div class="form-group">
                    <label for="ideaFullDesc">Подробное описание (внутри окна)</label>
                    <textarea id="ideaFullDesc" class="sketch-textarea" placeholder="Детали реализации, стек технологий, задачи..."></textarea>
                </div>

                <div class="form-group">
                    <label for="ideaLink">Ссылка (GitHub, сайт и т.д.)</label>
                    <input type="url" id="ideaLink" class="sketch-input" placeholder="https://github.com/...">
                </div>

                <button type="submit" class="submit-btn">✨ Добавить в каталог</button>
            </form>
        </div>
    </div>

    <script>
        (() => {
            const STORAGE_KEY = 'nlab_projects';
            const CATEGORY_LABELS = {
                games: 'GAMES',
                technologie: 'TECNOLOGE',
                lesson: 'LESSON',
                hobby: 'HOBBY / HEALTH'
            };

            let currentFilter = 'all';

            const gridEl = document.getElementById('projectsGrid');
            const filterBarEl = document.getElementById('filterBar');
            const projectModalEl = document.getElementById('projectModal');
            const addIdeaModalEl = document.getElementById('addIdeaModal');
            const addIdeaFormEl = document.getElementById('addIdeaForm');

            // Безопасная работа с localStorage
            function loadProjects() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    const parsed = raw ? JSON.parse(raw) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (err) {
                    console.error('Ошибка чтения localStorage:', err);
                    return [];
                }
            }

            function saveProjects(projects) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
                } catch (err) {
                    console.error('Ошибка записи в localStorage:', err);
                    alert('Не удалось сохранить идею в память браузера.');
                }
            }

            // Создание DOM-элемента карточки без innerHTML (защита от XSS)
            function createCardElement(project) {
                const card = document.createElement('article');
                card.className = 'card';
                card.addEventListener('click', () => openProjectModal(project));

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'delete-card-btn';
                delBtn.title = 'Удалить идею';
                delBtn.textContent = '×';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteIdea(project.id);
                });

                const topWrap = document.createElement('div');

                const header = document.createElement('div');
                header.className = 'card-header';

                const tag = document.createElement('span');
                tag.className = 'card-tag';
                tag.textContent = project.tagLabel || CATEGORY_LABELS[project.category] || 'IDEA';

                const icon = document.createElement('div');
                icon.className = 'card-icon';
                icon.textContent = project.icon || '💡';

                header.append(tag, icon);

                const title = document.createElement('h3');
                title.className = 'card-title';
                title.textContent = project.title;

                const desc = document.createElement('p');
                desc.className = 'card-desc';
                desc.textContent = project.shortDesc;

                topWrap.append(header, title, desc);

                const footer = document.createElement('div');
                footer.className = 'card-footer';

                const date = document.createElement('span');
                date.className = 'card-date';
                date.textContent = `📅 ${project.date}`;

                const actionLabel = document.createElement('span');
                actionLabel.className = 'card-link-btn';
                actionLabel.textContent = 'Открыть деталь →';

                footer.append(date, actionLabel);
                card.append(delBtn, topWrap, footer);

                return card;
            }

            // Отрисовка сетки
            function renderProjects() {
                gridEl.innerHTML = '';
                const projects = loadProjects();
                const filtered = currentFilter === 'all'
                    ? projects
                    : projects.filter(p => p.category === currentFilter);

                if (filtered.length === 0) {
                    const emptyBox = document.createElement('div');
                    emptyBox.className = 'empty-state';
                    emptyBox.textContent = currentFilter === 'all'
                        ? 'В каталоге пока нет ни одной идеи. Нажмите «+ Добавить идею», чтобы создать первую карточку! ✏️'
                        : 'В этой категории пока пусто. Нажмите «+ Добавить идею», чтобы пополнить раздел! 💡';
                    gridEl.appendChild(emptyBox);
                    return;
                }

                const fragment = document.createDocumentFragment();
                filtered.forEach(project => fragment.appendChild(createCardElement(project)));
                gridEl.appendChild(fragment);
            }

            // Фильтрация (делегирование событий)
            filterBarEl.addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;

                currentFilter = btn.dataset.category;
                filterBarEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderProjects();
            });

            // Открытие окна деталей
            function openProjectModal(project) {
                document.getElementById('modalTitle').textContent = project.title;
                document.getElementById('modalDesc').textContent = project.fullDesc || project.shortDesc;
                document.getElementById('modalPreviewIcon').textContent = project.icon || '💡';
                document.getElementById('modalPreviewTitle').textContent = `${project.title.toUpperCase()} SCHEMA`;

                const linkWrapper = document.getElementById('modalLinkWrapper');
                const linkEl = document.getElementById('modalLink');

                if (project.link && /^https?:\/\//i.test(project.link)) {
                    linkWrapper.style.display = 'block';
                    linkEl.href = project.link;
                } else {
                    linkWrapper.style.display = 'none';
                }

                projectModalEl.classList.add('active');
            }

            // Открытие окна добавления
            document.getElementById('openAddBtn').addEventListener('click', () => {
                addIdeaModalEl.classList.add('active');
                document.getElementById('ideaTitle').focus();
            });

            // Закрытие модалок по кнопке, фону или клавише Escape
            document.querySelectorAll('[data-close]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById(btn.dataset.close).classList.remove('active');
                });
            });

            window.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('active');
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal.active').forEach(m => m.classList.remove('active'));
                }
            });

            // Сохранение новой идеи
            addIdeaFormEl.addEventListener('submit', (e) => {
                e.preventDefault();

                const title = document.getElementById('ideaTitle').value.trim();
                const shortDesc = document.getElementById('ideaShortDesc').value.trim();
                if (!title || !shortDesc) return;

                const category = document.getElementById('ideaCategory').value;
                const newProject = {
                    id: `idea-${Date.now()}`,
                    title,
                    category,
                    tagLabel: CATEGORY_LABELS[category] || category.toUpperCase(),
                    icon: document.getElementById('ideaIcon').value.trim() || '💡',
                    shortDesc,
                    fullDesc: document.getElementById('ideaFullDesc').value.trim() || shortDesc,
                    date: document.getElementById('ideaDate').value.trim() || 'Ноя 2026',
                    link: document.getElementById('ideaLink').value.trim()
                };

                const projects = loadProjects();
                projects.unshift(newProject);
                saveProjects(projects);

                addIdeaFormEl.reset();
                document.getElementById('ideaIcon').value = '🚀';
                document.getElementById('ideaDate').value = 'Ноя 2026';
                addIdeaModalEl.classList.remove('active');

                renderProjects();
            });

            // Удаление идеи
            function deleteIdea(id) {
                if (!confirm('Удалить эту идею из каталога?')) return;
                const updated = loadProjects().filter(p => p.id !== id);
                saveProjects(updated);
                renderProjects();
            }

            // Инициализация
            renderProjects();
        })();
    </script>
</body>
</html>
